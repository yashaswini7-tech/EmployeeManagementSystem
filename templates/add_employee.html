<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Employee | EmployeeMS</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<div class="dashboard-wrapper">

    <aside class="sidebar">

        <div class="sidebar-logo">
            👥 EmployeeMS
        </div>

        <hr>

        <a
            href="{{ url_for('dashboard') }}"
            class="sidebar-link"
        >
            📊 Dashboard
        </a>

        <a
            href="{{ url_for('employees') }}"
            class="sidebar-link"
        >
            👥 Employees
        </a>

        <a
            href="{{ url_for('add_employee') }}"
            class="sidebar-link active"
        >
            ➕ Add Employee
        </a>

        <div class="sidebar-bottom">

            <a
                href="{{ url_for('logout') }}"
                class="sidebar-link"
            >
                🚪 Logout
            </a>

        </div>

    </aside>


    <main class="main-content">

        <div class="topbar">

            <div>

                <h4>
                    Add Employee
                </h4>

                <small class="text-muted">
                    Create a new employee record
                </small>

            </div>

        </div>


        <div class="content-card form-card">

            <form method="POST">

                <div class="row g-4">


                    <div class="col-md-6">

                        <label class="form-label">
                            Full Name *
                        </label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            placeholder="e.g. Rahul Sharma"
                            required
                        >

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Email *
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="rahul@example.com"
                            required
                        >

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Phone
                        </label>

                        <input
                            type="tel"
                            name="phone"
                            class="form-control"
                            placeholder="+91 9876543210"
                        >

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Department *
                        </label>

                        <select
                            name="department"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select Department
                            </option>

                            <option value="IT">
                                IT
                            </option>

                            <option value="HR">
                                HR
                            </option>

                            <option value="Finance">
                                Finance
                            </option>

                            <option value="Marketing">
                                Marketing
                            </option>

                            <option value="Sales">
                                Sales
                            </option>

                            <option value="Operations">
                                Operations
                            </option>

                        </select>

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Position *
                        </label>

                        <input
                            type="text"
                            name="position"
                            class="form-control"
                            placeholder="e.g. Software Developer"
                            required
                        >

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Salary *
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                ₹
                            </span>

                            <input
                                type="number"
                                name="salary"
                                class="form-control"
                                placeholder="50000"
                                min="0"
                                step="0.01"
                                required
                            >

                        </div>

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Date Joined *
                        </label>

                        <input
                            type="date"
                            name="date_joined"
                            class="form-control"
                            required
                        >

                    </div>

                </div>


                <hr class="my-4">


                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Add Employee
                    </button>

                    <a
                        href="{{ url_for('employees') }}"
                        class="btn btn-outline-secondary"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </main>

</div>

</body>

</html>
